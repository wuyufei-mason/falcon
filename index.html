<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄计时器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>🍅 番茄计时器</h1>
      <p class="subtitle">专注 25 分钟，休息 5 分钟，养成高效节奏</p>

      <section class="timer-card" aria-live="polite">
        <div class="session" id="sessionLabel">专注时间</div>
        <div class="time" id="timeDisplay">25:00</div>

        <div class="controls">
          <button id="startPauseBtn" class="primary">开始</button>
          <button id="resetBtn">重置</button>
          <button id="skipBtn">跳过阶段</button>
        </div>
      </section>

      <section class="settings">
        <h2>自定义设置</h2>
        <div class="setting-grid">
          <label>
            专注（分钟）
            <input id="focusInput" type="number" min="1" max="90" value="25" />
          </label>
          <label>
            短休息（分钟）
            <input id="shortBreakInput" type="number" min="1" max="30" value="5" />
          </label>
          <label>
            长休息（分钟）
            <input id="longBreakInput" type="number" min="1" max="60" value="15" />
          </label>
          <label>
            每轮专注次数
            <input id="roundsInput" type="number" min="1" max="8" value="4" />
          </label>
        </div>
      </section>

      <p class="hint" id="statusHint">点击“开始”进入第一轮专注。</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
